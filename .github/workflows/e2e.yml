name: e2e

# Playwright against the test build behind the e2e Caddy, exactly as `sh scripts/e2e.sh` runs it locally
# (docs/TESTING.md §6). Actions are pinned by commit SHA; the comment names the release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NUXT_TELEMETRY_DISABLED: '1'

jobs:
  e2e:
    name: Playwright (chromium, firefox, webkit-ui, mobile-chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Dev environment
        run: cp .env.dev.example .env
      - name: ffmpeg and ffprobe 9 (static build)
        run: |
          container=$(docker create mwader/static-ffmpeg:9.0.2)
          sudo docker cp "$container:/ffmpeg" /usr/local/bin/ffmpeg
          sudo docker cp "$container:/ffprobe" /usr/local/bin/ffprobe
          docker rm "$container" > /dev/null
          ffmpeg -hide_banner -version | head -n 1
          ffprobe -hide_banner -version | head -n 1
      - name: Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Playwright browsers and their system dependencies
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Dev stack (LiveKit advertises the runner's eth0 address)
        run: |
          echo "LiveKit node_ip: $(sh scripts/detect-ip.sh)"
          pnpm dev:deps
      # Headless Firefox has WebGL (background blur) only with an X display, like the local Docker runner.
      - name: E2E (1 worker; @nightly specs run in nightly.yml)
        run: >-
          xvfb-run -a -s "-screen 0 1920x1080x24" sh scripts/e2e.sh
          --project=chromium --project=firefox --project=webkit-ui --project=mobile-chromium
          --grep-invert @nightly
      - name: Upload the report, traces and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
            logs/e2e/
          if-no-files-found: ignore
          retention-days: 14
