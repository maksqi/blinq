name: nightly

# Slow and strict checks that never gate pull requests (docs/TESTING.md §6.7-6.9). The Edge job is non-blocking. macOS
# WebKit with E2EE is covered by the manual matrix (docs/TESTING.md §9): GitHub's macOS runners have no Docker
# (docs/ROADMAP.md backlog). Actions are pinned by commit SHA.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  NUXT_TELEMETRY_DISABLED: '1'
  E2E_NIGHTLY: '1'

jobs:
  join-time:
    # E2E_NIGHTLY=1 (workflow env) switches both specs to 1 warm-up + 10 joins with p50 and p95 assertions.
    name: Join time p50 < 1.5 s, p95 < 3 s
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.dev.example .env
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm dev:deps
      - run: sh scripts/e2e.sh --project=chromium tests/e2e/call/join-time.spec.ts tests/e2e/join/guest-invite.spec.ts

  network-degradation:
    # Chromium's CDP WebRTC emulation (packet loss, latency, 500 kbit/s); tc netem stays the manual Firefox path
    # (TESTING.md §6.9).
    name: Network degradation (CDP)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.dev.example .env
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm dev:deps
      - run: sh scripts/e2e.sh --project=chromium --grep @nightly network/degradation

  long-recording:
    # Upload backlog, memory and the partial finalize path (TESTING.md §6.8). ffmpeg and ffprobe come from
    # mwader/static-ffmpeg:9.0.2 as in e2e.yml.
    name: Long recording (30 min)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      E2E_LONG_RECORDING_MINUTES: '30'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.dev.example .env
      - name: ffmpeg and ffprobe 9 (static build)
        run: |
          container=$(docker create mwader/static-ffmpeg:9.0.2)
          sudo docker cp "$container:/ffmpeg" /usr/local/bin/ffmpeg
          sudo docker cp "$container:/ffprobe" /usr/local/bin/ffprobe
          docker rm "$container" > /dev/null
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm dev:deps
      - run: sh scripts/e2e.sh --project=chromium --grep @nightly recording/long

  edge:
    # The msedge project exists only with E2E_NIGHTLY_BROWSERS=1 (playwright.config.ts).
    name: Microsoft Edge (non-blocking)
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      E2E_NIGHTLY_BROWSERS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.dev.example .env
      - run: pnpm exec playwright install --with-deps msedge
      - run: pnpm dev:deps
      - run: sh scripts/e2e.sh --project=msedge --grep-invert @nightly
